name: CI

# Public, SDK-free CI. The Sony Camera Remote SDK can only be obtained by a human
# manually accepting Sony's license form on the official download page, so nothing
# SDK-related (headers, libraries, or the stock shared/core helper sources) can be
# fetched, installed, or built here. Official platform binaries are produced by
# Sony out-of-band. This workflow runs only checks that need no SDK.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

jobs:
  # Guards the PUBLIC repo only. The private development repo deliberately
  # tracks the SDK headers, the sample-derived wrapper sources and the OpenCV
  # headers so a clone is immediately readable without re-extracting the SDK —
  # it is not subject to this check.
  compliance:
    name: License compliance (no SDK source committed)
    if: github.repository != 'jordlee/MacOS-SDK-Sample-App'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no Sony SDK / wrapper / binary files are tracked
        shell: bash
        run: |
          echo "Checking that no SDK source or binaries are committed..."
          matches=$(git ls-files | grep -E \
            'shared/(sdk|opencv/(include|Darwin|Linux|Windows))/|shared/core/.*\.(cpp|h)$|\.(dylib|so|dll|a|lib)$' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Sony SDK / wrapper / binary files must not be committed to this public repo:"
            echo "$matches"
            echo ""
            echo "Only shared/core/CMakeLists.txt and shared/core/README.md may be tracked."
            echo "See docs/SDK_SETUP.md."
            exit 1
          fi
          echo "OK: no SDK source or binaries tracked."

  unit-tests:
    name: Unit tests (deterministic, no camera/SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        working-directory: tests/unit
        run: npm test

  scripts:
    name: Shell script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check extraction helper
        run: bash -n scripts/extract-sdk.sh

  cli-build:
    name: crsdk CLI (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the CLI
        working-directory: cli
        run: |
          npm install
          npm run build
          node dist/bin/crsdk.js version

  mcp:
    name: MCP server (codegen drift + build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci
      # Regenerate the flat tools + types from the single spec (api/openapi.yaml)
      # via the shipped CLI, then fail if the committed output drifts. The
      # coverage gate in gen-tools.mjs runs inside gen:mcp and rejects any
      # unclassified endpoint.
      - name: Regenerate from the spec (crsdk gen:mcp)
        run: ./crsdk gen:mcp
      - name: Fail on codegen drift
        run: |
          git diff --exit-code -- \
            mcp/src/api/schema.d.ts \
            mcp/src/api/property-names.ts \
            mcp/src/tools/generated.ts \
          || { echo "::error::MCP generated files are stale — run 'crsdk gen:mcp' and commit."; exit 1; }
      - name: Typecheck
        working-directory: mcp
        run: npm run typecheck
      - name: Build (crsdk build:mcp)
        run: ./crsdk build:mcp
      - name: Unit tests
        working-directory: mcp
        run: npm test

  # When a PR changes the OpenAPI contract, the docs must change too. The MCP
  # side is already enforced by the `mcp` job's codegen-drift gate; this covers
  # the documentation site. See CONTRIBUTING.md and the alpha-sdk-sync-artifacts
  # skill.
  spec-docs-sync:
    name: Spec ↔ docs sync (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a docs update when api/openapi.yaml changes
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          if echo "$changed" | grep -qx 'api/openapi.yaml'; then
            if echo "$changed" | grep -qE '^(site/src/content/docs/|docs/)'; then
              echo "OK: the spec change includes a docs update."
            else
              echo "::error::api/openapi.yaml changed but no docs were updated. Update site/src/content/docs/ (or docs/) in the same PR — see CONTRIBUTING.md and the alpha-sdk-sync-artifacts skill."
              exit 1
            fi
          else
            echo "No spec change in this PR; nothing to check."
          fi
