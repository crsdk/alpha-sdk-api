openapi: 3.1.0
info:
  title: Alpha Camera REST API
  version: 3.0.0
  description: |
    RESTful control for Sony cameras — shooting, settings, live view with OSD overlay,
    focus control, and file transfer through a clean HTTP interface.

    Built on the Sony Camera Remote SDK. Supports USB and network camera connections
    with multi-camera simultaneous operation.

    ## Connection Modes

    | Mode | Description |
    |------|-------------|
    | `remote` | Full camera control: shooting, settings, live view. Auto-transfer images to host PC. |
    | `remote-transfer` | Camera control + explicit SD card file access. Most capable mode. |
    | `contents` | SD card file access only. No shooting or settings control. |

    ## Quick Start

    1. `GET /api/cameras` — discover cameras
    2. `POST /api/cameras/{id}/connection` — connect
    3. `PUT /api/cameras/{id}/priority-key` — set to `pc-remote`
    4. `PUT /api/cameras/{id}/properties/{name}` — configure settings
    5. `POST /api/cameras/{id}/actions/af-shutter` — shoot
    6. `DELETE /api/cameras/{id}/connection` — disconnect

    ## Priority Key Requirement

    The camera's priority key **must** be set to `pc-remote` before it accepts any
    remote property changes or shooting commands.
  license:
    name: Proprietary
  contact:
    name: Camera Remote SDK
    url: https://github.com/ocjlee888/camera-remote-sdk-project

servers:
  - url: http://{host}:{port}
    description: |
      Local camera server. The server binary runs on the host that has the
      camera physically connected (USB or network). Defaults to
      `http://localhost:8080`; override `host` and `port` when the server
      runs on a different machine (e.g. a Raspberry Pi next to the camera).
    variables:
      host:
        default: localhost
        description: Host running the camera server binary
      port:
        default: "8080"
        description: Port the camera server is listening on

# No authentication — local server only
security: []

tags:
  - name: Connection
    description: Camera discovery, connection, and disconnection
  - name: Properties
    description: Read and write camera properties (ISO, aperture, shutter speed, etc.)
  - name: Actions
    description: Shooting commands and motor control (shutter, zoom, focus)
  - name: Live View
    description: Live view streaming and OSD overlay control
  - name: Events
    description: Server-Sent Events for real-time camera callbacks
  - name: SD Card
    description: SD card file browsing and download
  - name: Settings
    description: Save path configuration and camera settings file management
  - name: Server
    description: Server health, status, and log retrieval

paths:
  # ============================================================
  # Server Management
  # ============================================================

  /api/server/status:
    get:
      operationId: getServerStatus
      x-fern-sdk-group-name: server
      x-fern-sdk-method-name: status
      summary: Server health check
      description: |
        Returns server health, uptime, version info, and connected camera count.
        Used by the TypeScript `ServerManager` to confirm the server is ready after spawning the binary.
      tags: [Server]
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatus"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/server/logs:
    get:
      operationId: getServerLogs
      x-fern-sdk-group-name: server
      x-fern-sdk-method-name: logs
      summary: Get recent server logs
      description: |
        Returns buffered server log output. Useful for debugging connection issues,
        SDK errors, and property change confirmations without accessing the terminal.
      tags: [Server]
      parameters:
        - name: lines
          in: query
          description: Number of recent log lines to return (default 100)
          schema:
            type: integer
            default: 100
        - name: level
          in: query
          description: Minimum log level filter
          schema:
            type: string
            enum: [debug, info, warn, error]
            default: info
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerLogsResponse"

  /api/server/shutdown:
    post:
      operationId: shutdownServer
      x-fern-sdk-group-name: server
      x-fern-sdk-method-name: shutdown
      summary: Graceful server shutdown
      description: |
        Initiates graceful shutdown: disconnects all cameras, closes SSE
        connections, then exits.
      tags: [Server]
      responses:
        "200":
          description: Shutdown initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShutdownServerResponse"
        "500":
          description: Shutdown failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================
  # Connection
  # ============================================================

  /api/cameras:
    get:
      operationId: listCameras
      x-fern-sdk-group-name: cameras
      x-fern-sdk-method-name: list
      summary: List available cameras
      description: Enumerate all cameras connected via USB and network.
      tags: [Connection]
      responses:
        "200":
          description: Camera list retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraListResponse"
        "500":
          description: SDK error during enumeration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/connection:
    post:
      operationId: connectCamera
      x-fern-sdk-group-name: cameras
      x-fern-sdk-method-name: connect
      summary: Connect to camera
      description: Establish connection in the specified mode. Defaults to `remote` if no mode provided.
      tags: [Connection]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
      responses:
        "200":
          description: Camera connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          description: |
            Connection request rejected. This includes invalid `mode` values,
            no cameras discovered, target camera ID not present in the latest
            enumeration, all cameras already connected, or an SDK connect
            failure after a valid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: getConnectionStatus
      x-fern-sdk-group-name: cameras
      x-fern-sdk-method-name: getConnectionStatus
      summary: Check connection status
      description: |
        Returns the current connection state for a camera (connected/disconnected,
        model, id). When connected, `data.mode` reports the active SDK
        connection mode (`remote` / `remote-transfer` / `contents`).
      tags: [Connection]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatusResponse"

    delete:
      operationId: disconnectCamera
      x-fern-sdk-group-name: cameras
      x-fern-sdk-method-name: disconnect
      summary: Disconnect camera
      description: |
        Cleanly disconnects from the specified camera. Server emits a synthetic
        `disconnected` SSE event before clearing internal callbacks.
      tags: [Connection]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      responses:
        "200":
          description: Camera disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          $ref: "#/components/responses/OperationRejected"

  # ============================================================
  # Properties
  # ============================================================

  /api/cameras/{cameraId}/properties/{propertyName}:
    get:
      operationId: getProperty
      x-fern-sdk-group-name: properties
      x-fern-sdk-method-name: get
      summary: Get a camera property
      description: |
        Returns the current value, human-readable format, writability flag, and all
        values the camera currently accepts for this property.

        ## `writable` and `available_values` are a snapshot, not a spec

        Both describe the camera **right now**, and both move as other settings
        change. Two things routinely surprise callers:

        **The priority key gates writability.** Read a property while the camera
        holds `camera-position` and most of the body reports `writable: false`
        with an empty `available_values`. Claim `pc-remote` first — see
        `setPriorityKey` — or you will conclude a camera cannot do things it can.
        Measured on an ILCE-7M5: `focus-area` went from `writable: false` with no
        values to `writable: true` with 24 values, purely from the priority key.

        **Other properties gate the value list.** `focus-area` is the clearest
        case: its Tracking variants only exist while `focus-mode` is a continuous
        mode. On an ILCE-1M2 in `AF_S` the list has 12 entries and no Tracking
        entries at all, so setting `0x17` (`Tracking Expand Flexible Spot`) is
        rejected as not available — correctly, because at that moment it is not.
        Switch `focus-mode` to `AF_C` and the Tracking variants appear.

        So do not cache these fields, and do not treat a value's absence as
        "this model cannot do it". Re-read the property after changing anything
        related, and prefer a value taken from the live `available_values` over a
        constant from another body.
      tags: [Properties]
      parameters:
        - $ref: "#/components/parameters/cameraId"
        - $ref: "#/components/parameters/propertyName"
      responses:
        "200":
          description: Property retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPropertyResponse"
        "400":
          description: |
            Unknown property name, property getter not implemented, camera not
            connected, or property retrieval failed inside the SDK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: setProperty
      x-fern-sdk-group-name: properties
      x-fern-sdk-method-name: set
      summary: Set a camera property
      description: |
        Set a camera property value. Accepts hex values (from GET response `available_values`)
        or human-readable strings (e.g. `"f/5.6"`, `"1/250"`, `"wide"`).

        The server validates against the camera's current available values and checks
        writability before sending to the SDK.
      tags: [Properties]
      parameters:
        - $ref: "#/components/parameters/cameraId"
        - $ref: "#/components/parameters/propertyName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertySetRequest"
      responses:
        "200":
          description: Property set successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          description: |
            Malformed request body, missing `value`, unknown property, invalid
            value format, property not writable, camera not connected, or the
            camera rejected the property set in its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/properties/all:
    get:
      operationId: getAllProperties
      x-fern-sdk-group-name: properties
      x-fern-sdk-method-name: getAll
      summary: Get all camera properties in one call
      description: |
        Returns every property the camera currently reports, deduplicated by name
        (the SDK occasionally returns multiple internal entries for the same
        property — the server picks the entry that has values or is writable).

        ## Important: response shape differs from single-property GET

        The per-property entries here use a DIFFERENT shape than
        `getProperty` — see `BulkPropertyEntry` vs `PropertyData`. Highlights:

        - Field names: `current_value` / `current_hex_value` / `current_formatted`
          instead of `value` / `formatted`
        - `writable` is a real boolean here (not the stringified `"true"`/`"false"`
          you get from single GET)
        - `available_values` entries carry both numeric `value` and `hex_value`

        Use this endpoint for "load everything once" UI flows. Use single GET
        when you need just one property and want the consistent setter format.
      tags: [Properties]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      responses:
        "200":
          description: All properties retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllPropertiesResponse"
        "400":
          description: Camera not connected or bulk property retrieval failed in the SDK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/af-area-position:
    get:
      operationId: getAFAreaPosition
      x-fern-sdk-group-name: focus
      x-fern-sdk-method-name: getAreaPosition
      summary: Get the AF frame position
      description: |
        Return the camera's current autofocus frame(s) — position, size and focus
        state — so a client can draw a focus box over a live view.

        Each frame reports its centre three ways: `normalized` (0-1, the value to
        use for overlays at any resolution), `position` (the same point in the
        coordinate space `setAFAreaPosition` expects, so a read can be written
        straight back), and `raw` (the camera's own numerator/denominator pair).
        `size.normalized_width` / `normalized_height` give the box dimensions as a
        fraction of the frame.

        **More than one frame can be returned.** An expanding area reports the
        main box plus its assist box — an ILCE-7M4 set to Tracking Expand Flexible
        Spot returns a 38x38 `contrast-flexible-main` and a 76x76
        `contrast-flexible-assist`. Draw them all.

        `state` (`focused`, `not-focused`, `moving`, `selection`, …) is the value
        to drive box colour from.

        ## When this returns 400

        The camera only reports a frame for focus areas that actually draw a box —
        Flexible Spot, Expand Flexible Spot, Tracking variants. In Wide or a
        face/eye-priority mode there is no movable frame and nothing is reported.
        Live view should be streaming, since this reads a live-view property.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      responses:
        "200":
          description: AF frame(s) retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AFAreaPositionResponse"
        "400":
          description: |
            No AF frame available — usually a focus area with no movable box, or
            live view not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: setAFAreaPosition
      x-fern-sdk-group-name: focus
      x-fern-sdk-method-name: setAreaPosition
      summary: Move the AF frame
      description: |
        Move the centre of the autofocus frame. Send either absolute coordinates
        (`x` 0-639, `y` 0-479) or `normalized` 0-1 values — the latter is usually
        what you want when translating a tap or click on a live view.

        ## The camera clamps, and does not tell you

        The usable area is smaller than the full range: it is inset from the edges
        and varies by model, aspect ratio and AF setting. A request inside
        0-639/0-479 is always accepted with `200`, then silently clamped.

        Measured on an ILCE-7M4 with Tracking Expand Flexible Spot — every corner
        was requested and every one was pulled inward, symmetrically:

        | Requested | Landed |
        |---|---|
        | `0, 0` | `65, 61` |
        | `639, 0` | `574, 61` |
        | `639, 479` | `574, 418` |
        | `0, 479` | `65, 418` |
        | `320, 240` | `320, 240` |

        That is a usable area of x `65-574`, y `61-418` — the middle 80% x 74% of
        the coordinate space. Treat those numbers as illustrative, not a contract:
        a different body, aspect ratio or AF area will inset differently.

        A write is also ignored outright when the focus area has no movable box.
        **Always follow up with `getAFAreaPosition` to see where the frame
        actually is** rather than assuming the requested value took.

        Requires priority key `pc-remote`.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AFAreaPositionRequest"
      responses:
        "200":
          description: |
            Accepted by the camera. The frame may have been clamped — confirm with
            `getAFAreaPosition`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          description: |
            Missing or malformed body, coordinates out of range, or the camera
            rejected the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/fingerprint:
    get:
      operationId: getFingerprint
      x-fern-sdk-group-name: connection
      x-fern-sdk-method-name: getFingerprint
      summary: Get the camera's authentication fingerprint
      description: |
        Return the fingerprint of a camera that uses **access authentication**,
        for use as `auth.fingerprint` when connecting.

        Read this rather than transcribing the value from the camera's network
        screen. The value here comes from the SDK, which is what the connect
        check compares against, and a hand-copied value is easy to get subtly
        wrong — a single missing `=` of base64 padding fails with `0x8215`.

        Works **before** connecting, which is the point: the fingerprint is an
        input to `connectCamera`, not a result of it. The camera only needs to
        have been discovered.

        ## Cameras without access authentication

        Returns `200` with `ssh_supported: false` and no `fingerprint`. That is
        not an error — USB connections and bodies with authentication off need no
        fingerprint at all.
      tags: [Connection]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      responses:
        "200":
          description: |
            Fingerprint retrieved, or the camera does not use access
            authentication — check `ssh_supported`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintResponse"
        "400":
          description: |
            The camera reports access authentication but the SDK could not read
            its fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/tracking-frame:
    get:
      operationId: getTrackingFrame
      x-fern-sdk-group-name: focus
      x-fern-sdk-method-name: getTrackingFrame
      summary: Get the tracking frame
      description: |
        Return the box the camera is tracking a subject in, after a
        `remoteTouch`. The shape is the same as `getAFAreaPosition` — `normalized`
        for overlays, `position` in the coordinate space `remoteTouch` accepts,
        `raw` as the camera reports it — so the same overlay code renders both.

        Poll this to follow a moving subject: the camera updates the frame on its
        own once tracking has been seeded.

        `type` is `target-af` for the subject being tracked, `non-target-af` for a
        candidate the camera is showing but not acting on.

        ## Empty is a normal answer

        With nothing being tracked this returns `200` with `frames: []` and
        `available: true` — the property was readable, there was just no subject.
        A `400` means the property could not be read at all, usually because live
        view is not running.

        Two ways to get a frame here, both measured on an ILCE-7M4:

        - `remoteTouch`, with the body's **Touch Func. in Shooting** set to
          `Touch Tracking`. Tracking then holds on its own with no button held.
        - The camera tracking for its own reasons — a tracking focus area with AF
          engaged. Holding `af-on` in `Tracking: Expand Flexible Spot` reports a
          `target-af` frame that disappears on release.

        With the ILCE-7M4 default of `Touch Focus`, a touch moves the AF frame
        instead and nothing appears here — read `getAFAreaPosition` in that case.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      responses:
        "200":
          description: |
            Tracking frame read. `frames` is empty when nothing is being tracked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingFrameResponse"
        "400":
          description: |
            The tracking frame could not be read — usually live view is not
            running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/priority-key:
    get:
      operationId: getPriorityKey
      x-fern-sdk-group-name: properties
      x-fern-sdk-method-name: getPriorityKey
      summary: Get priority key setting
      description: |
        Returns the current priority key setting (`pc-remote` or `camera-position`).

        **Note**: FX3 / cinema bodies do not implement `PriorityKeySettings` —
        GET returns empty data and SET returns SDK error `0x8402`. These bodies
        auto-enter PC Remote mode on USB.
      tags: [Properties]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      responses:
        "200":
          description: Priority key retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPriorityKeyResponse"
        "400":
          $ref: "#/components/responses/OperationRejected"

    put:
      operationId: setPriorityKey
      x-fern-sdk-group-name: properties
      x-fern-sdk-method-name: setPriorityKey
      summary: Set priority key
      description: |
        Set the priority key. Must be `pc-remote` for the camera to accept remote
        property changes and shooting commands. Not supported on FX3 / cinema
        bodies (returns 400).
      tags: [Properties]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPriorityKeyRequest"
      responses:
        "200":
          description: Priority key set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          description: |
            Invalid request body or the camera rejected the priority-key change.
            FX3 / cinema bodies may return SDK error `0x8402` because this
            property is not implemented there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================
  # Actions
  # ============================================================

  /api/cameras/{cameraId}/actions/shutter:
    post:
      operationId: triggerShutter
      x-fern-sdk-group-name: actions
      x-fern-sdk-method-name: shutter
      summary: Take a photo
      description: |
        Single shot (no body or empty body), or continuous shooting with `down`/`up` control.
        For continuous shooting, set drive mode to a continuous mode first.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShutterRequest"
      responses:
        "200":
          description: Shutter action executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          $ref: "#/components/responses/OperationRejected"

  /api/cameras/{cameraId}/actions/button:
    post:
      operationId: pressCameraButton
      x-fern-sdk-group-name: actions
      x-fern-sdk-method-name: button
      summary: Press a button on the camera body
      description: |
        Press a physical button — menu, enter, the D-pad, C1-C7, playback and so
        on — as if someone pressed it on the body. Combined with live view and
        `getOSDFrame` this is enough to drive the camera's own menus remotely and
        read the result back off the screen.

        Omit `action` for a full press. Send `down` and a later `up` to hold a
        button, the same contract as `triggerShutter`.

        ## Not every body exposes every button

        The camera reports which keys it will accept, and that list is much
        shorter than the full enum. An ILCE-7M4 reports 24: the D-pad and
        multi-selector, `enter`, `menu`, `fn`, `playback`, `c1`-`c4`, `movie`,
        `ael` and `af-on` — but **not** `delete`, `mode`, `c5`-`c7`, `display`,
        `home`, `clips`, `slot-select`, `cancel-back` or `thumbnail`.

        A rejected press returns `400` with the camera's own supported list in
        `data.supported_buttons`, so you can discover the real set at runtime.

        ## Held keys block new presses

        The SDK only starts a press while the camera reports itself idle, so a
        button already held — by this API or by a hand on the body — makes the
        next press fail. A release is never blocked: an `up` always goes through,
        so a held key can always be let go.

        Requires priority key `pc-remote`.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ButtonRequest"
      responses:
        "200":
          description: Button press sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          description: |
            Missing or unknown `button`, invalid `action`, or the camera refused
            the press because a key is already held. When the camera reported its
            operable keys they are listed in `data.supported_buttons`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/actions/touch:
    post:
      operationId: remoteTouch
      x-fern-sdk-group-name: actions
      x-fern-sdk-method-name: touch
      summary: Touch a point in the frame
      description: |
        Tap a point in the live-view frame, as if someone touched the camera's own
        screen there. Send absolute coordinates (`x` 0-639, `y` 0-479) or
        `normalized` 0-1 values — the latter is what you want for a tap or click
        on a live view.

        ## This is not `setAFAreaPosition`

        `setAFAreaPosition` drags the focus box to a point and leaves it there. A
        touch **seeds the camera's subject tracking**: the camera locks onto
        whatever is at that point and then follows it on its own. You cannot get
        that by rewriting positions from a client. Touch also works in focus areas
        that have no movable box — Wide, face priority — where
        `setAFAreaPosition` has nothing to move.

        Read the result with `getTrackingFrame`.

        ## The camera decides what a touch does

        The SDK property that would select the touch behaviour
        (`FunctionOfRemoteTouchOperation`) is unsupported on Alpha bodies
        including the ILCE-7M4 — only broadcast bodies can choose. A touch does
        whatever the body's own **Touch Func. in Shooting** is set to
        (`MENU > Setup > Touch Operation > Touch Panel Settings > Shooting
        Screen`), and that setting is not exposed over this API:

        | Touch Func. in Shooting | What `remoteTouch` does |
        |---|---|
        | `Touch Focus` (ILCE-7M4 default) | Moves the AF frame, like `setAFAreaPosition`. `getTrackingFrame` stays empty. |
        | `Touch Tracking` | Starts subject tracking at the point. `getTrackingFrame` reports the box. |

        Both were measured on an ILCE-7M4. Note the touch is accepted **even when
        the body's `Touch Operation` is `Off`** — that setting governs the
        physical screen, not the remote property.

        ## A 200 does not mean tracking started

        The camera accepts the write and then decides. With `Touch Tracking` set,
        a touch on a point with nothing trackable — measured on flat wall and
        blown-out window areas — returns `200` and produces no tracking frame at
        all. **Always read `getTrackingFrame` to find out what actually
        happened.**

        Touches land close to where they are asked for but not exactly: the
        camera snaps to the nearest feature it can hold. Measured on an ILCE-7M4,
        `320,240` landed at `320,239` and `200,300` at `209,297`, while points
        near the edges pulled further in — `0,479` landed at `35,445`.

        Leave a beat between touches. Firing several within a second or so, or
        immediately after a `cancelRemoteTouch`, made the camera drop tracking
        entirely until it was left alone.

        ## When this returns 400

        Touch is gated on the camera reporting it as currently available. On the
        ILCE-7SM3 and ILCE-7C it is movie-mode only; other bodies gate it on focus
        mode or on live view running. A rejected touch says which gate failed.

        Requires priority key `pc-remote`.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TouchRequest"
      responses:
        "200":
          description: |
            Touch sent. Confirm what the camera locked onto with
            `getTrackingFrame`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          description: |
            Missing or malformed coordinates, coordinates out of range, or the
            camera reports remote touch as unavailable right now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/actions/touch-cancel:
    post:
      operationId: cancelRemoteTouch
      x-fern-sdk-group-name: actions
      x-fern-sdk-method-name: touchCancel
      summary: Cancel a touch / stop tracking
      description: |
        Release the subject a `remoteTouch` locked onto. No body required.

        The camera only accepts a cancel while it has something to cancel, so this
        returns `400` when nothing is being tracked. That is a safe no-op, not a
        failure to retry.

        The gate is specifically about a **remote touch** being in progress, not
        about tracking in general. Tracking the camera started itself — a tracking
        focus area with `af-on` held — reports nothing to cancel, because there is
        no remote touch operation to release. The camera's ready flag also lags a
        successful cancel by a beat, so an immediate second call can still report
        success; treat `getTrackingFrame` as the truth.

        Requires priority key `pc-remote`.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      responses:
        "200":
          description: Tracking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          description: |
            Nothing to cancel — the camera is not tracking a touched subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

