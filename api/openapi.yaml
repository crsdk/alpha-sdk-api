      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInfoRequest"
      responses:
        "200":
          description: Save info set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          description: |
            Malformed JSON body, missing required `path`, or the camera/server
            rejected the save-info update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/settings/download:
    post:
      operationId: downloadCameraSettings
      x-fern-sdk-group-name: settings
      x-fern-sdk-method-name: download
      summary: Save camera settings to PC
      description: |
        Download the camera's current settings to a file on the host PC.

        The file is written to a `camera_settings/` directory relative to the
        **server's** working directory — not a caller-supplied path. There is no
        `save_path` for this endpoint (unlike the SD card endpoints); the optional
        `filename` only names the file. The response `data.path` reports where it
        landed. A typical file is `CUMSET.DAT`, around 180 KB.

        Completion also emits a `downloadComplete` SSE event.

        ## Requires the camera to allow it

        The SDK only permits this when the camera reports
        `camera-setting-save-enable` as `1` and `camera-setting-save-read-state`
        as `0` (Idle). Read those via `getAllProperties` before calling — a `400`
        here usually means the camera is refusing, not that the request was
        malformed.

        The camera will not enable it without recording media present. On bodies
        with two card slots this means **slot 1** specifically: an ILCE-7M4 with a
        card in slot 2 only reports `camera-setting-save-enable: 0` and rejects
        the call.
      tags: [Settings]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsFileRequest"
      responses:
        "200":
          description: Settings file saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          description: Camera settings download failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/settings/upload:
    post:
      operationId: uploadCameraSettings
      x-fern-sdk-group-name: settings
      x-fern-sdk-method-name: upload
      summary: Load settings to camera
      description: |
        Upload a previously saved settings file back to the camera. `filename` is
        required and is resolved inside the server's `camera_settings/` directory —
        use `listCameraSettingsFiles` to see what is available.

        **The camera reboots and drops the connection** once the settings are
        applied. Reconnect afterwards; the response carries this as
        `data.warning`. The result arrives as an SSE `settingsResult` event with
        `{"operation":"read","success":true}`.

        ## Requires the camera to allow it

        Gated the same way as `downloadCameraSettings`, but on
        `camera-setting-read-enable` being `1` (with
        `camera-setting-save-read-state` at `0`). Recording media must be present —
        **slot 1** on two-slot bodies. Read those properties via
        `getAllProperties` to tell a refusing camera from a bad request.
      tags: [Settings]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsFileRequest"
      responses:
        "200":
          description: Settings uploaded to camera
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraResponse"
        "400":
          description: |
            Missing filename in the request body or the settings upload failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/settings/files:
    get:
      operationId: listSettingsFiles
      x-fern-sdk-group-name: settings
      x-fern-sdk-method-name: listFiles
      summary: List saved settings files
      description: |
        Lists camera settings files (`*.DAT`) previously saved to the host PC
        via `downloadCameraSettings`. This is a host-side file listing; the
        path currently includes `cameraId` for consistency with the rest of
        the API, but the handler does not validate that camera.
      tags: [Settings]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      responses:
        "200":
          description: Settings file list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsFileListResponse"
        "400":
          description: Host-side settings file listing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cameras/{cameraId}/lut/import:
    post:
      operationId: importLUT
      x-fern-sdk-group-name: settings
      x-fern-sdk-method-name: importLUT
      summary: Import a .cube LUT file to the camera
      description: |
        Initiates an async import of a `.cube` LUT file from the host filesystem
        into one of the camera's user LUT slots (1–16). CineEI / cinema bodies only.
      tags: [Settings]
      parameters:
        - $ref: "#/components/parameters/cameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LUTImportRequest"
      responses:
        "202":
          description: LUT import accepted (async)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LUTImportResponse"
        "400":
          description: Invalid request (missing filePath, slot out of range, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ============================================================
# Components
# ============================================================

components:
  responses:
    RequestValidationError:
      description: |
        Invalid request body or parameter shape. Use this when the JSON payload
        is malformed, a required field is missing, or a parameter cannot be
        parsed before any camera operation is attempted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    OperationRejected:
      description: |
        The request was syntactically valid, but the camera or server rejected
        it due to connection state, unsupported capability, property
        writability, current shooting mode, or another runtime precondition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    WrongConnectionMode:
      description: |
        The endpoint is valid, but not in the camera's current connection
        mode. Reconnect using the documented mode for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NoFrameAvailable:
      description: |
        No frame is currently available. This usually means streaming has not
        been started yet, no frame has been captured yet, or OSD/composite
        prerequisites are not satisfied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Camera, file, or resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    cameraId:
      name: cameraId
      in: path
      required: true
      description: Camera identifier (e.g. `D10F60149B0C`)
      schema:
        type: string

    propertyName:
      name: propertyName
      in: path
      required: true
      description: Property name
      schema:
        $ref: "#/components/schemas/PropertyName"

    slotNumber:
      name: slotNumber
      in: path
      required: true
      description: SD card slot number (1 or 2)
      schema:
        type: integer
        enum: [1, 2]

    contentId:
      name: contentId
      in: path
      required: true
      description: SDK content identifier from `listSDCardFiles` response
      schema:
        type: integer

    fileId:
      name: fileId
      in: path
      required: true
      description: SDK file identifier from `listSDCardFiles` response (always `0` in contents-transfer mode)
      schema:
        type: integer

  schemas:
    # --- Camera objects ---

    CameraInfo:
      type: object
      description: Camera discovered during enumeration
      required: [id, model, connectionType, connected]
      properties:
        id:
          type: string
          example: D10F60149B0C
        model:
          type: string
          example: ILCE-9M3
        connectionType:
          type: string
          enum: [USB, Network]
        connected:
          type: boolean

    CameraSummary:
      type: object
      description: Camera info embedded in API responses
      properties:
        connected:
          type: boolean
          example: false
        model:
          type: string
          example: ILCE-7M4
        id:
          type: string
          example: D06CE05E3323

    # --- Standard responses ---

    CameraResponse:
      type: object
      description: |
        Generic envelope returned by most camera operations. The shape of
        `data` varies per endpoint — most operations return an empty or
        null `data`; operations that return structured data document a
        specific shape. SDK-generated types can treat `data` as an opaque
        map for generic endpoints.
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        camera:
          $ref: "#/components/schemas/CameraSummary"
        data:
          type: object
          additionalProperties: true

    # --- Hoisted response envelopes (named for clean SDK typing) ---

    ConnectionStatusResponse:
      type: object
      description: |
        Response envelope for `GET /api/cameras/{id}/connection`. When the
        camera is connected, `data.mode` reports the active SDK connection
        mode (`remote` / `remote-transfer` / `contents`) so clients don't
        have to remember what they passed at connect time. When the camera
        is not connected, `data` is omitted.
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        camera:
          $ref: "#/components/schemas/CameraSummary"
        data:
          type: object
          properties:
            mode:
              $ref: "#/components/schemas/ConnectionMode"

    CameraListResponse:
      type: object
      required: [success, cameras]
      properties:
        success:
          type: boolean
        message:
          type: string
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/CameraInfo"

    GetPropertyResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        camera:
          $ref: "#/components/schemas/CameraSummary"
        data:
          $ref: "#/components/schemas/PropertyData"

    GetAllPropertiesResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        camera:
          $ref: "#/components/schemas/CameraSummary"
        data:
          $ref: "#/components/schemas/BulkPropertiesData"

    GetPriorityKeyResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        camera:
          $ref: "#/components/schemas/CameraSummary"
        data:
          $ref: "#/components/schemas/PriorityKeyData"

    GetLiveViewStatusResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        camera:
          $ref: "#/components/schemas/CameraSummary"
        data:
          $ref: "#/components/schemas/LiveViewStatus"

    GetOSDStatusResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        camera:
          $ref: "#/components/schemas/CameraSummary"
        data:
          $ref: "#/components/schemas/OSDStatus"

    GetSaveInfoResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        camera:
          $ref: "#/components/schemas/CameraSummary"
        data:
          $ref: "#/components/schemas/SaveInfoData"

    ServerLogsResponse:
      type: object
      required: [success, logs]
      properties:
        success:
          type: boolean
        logs:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        total:
          type: integer
          description: Total buffered log count

    ShutdownServerResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string

    SetPriorityKeyRequest:
      type: object
      required: [setting]
      properties:
        setting:
          $ref: "#/components/schemas/PriorityKeySetting"

    ErrorResponse:
      type: object
      description: |
        Standard non-2xx response envelope. The API does not currently expose a
        stable machine-readable error code in the JSON body, so clients should
        branch on HTTP status first and then inspect `message` for the
        human-readable reason.
      example:
        success: false
        message: Camera not connected
        camera:
          connected: false
          model: ILCE-7M4
          id: D06CE05E3323
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
          example: false
        message:
          type: string
          example: Camera not connected
        camera:
          $ref: "#/components/schemas/CameraSummary"

    # --- Property schemas ---

    PropertyData:
      type: object
      description: |
        Single-property GET payload returned under `data` by
        `GET /api/cameras/{id}/properties/{name}`.
      required: [property, value, formatted, writable]
      properties:
        property:
          type: string
          description: REST property name (matches `PropertyName` enum)
        value:
          type: string
          description: Hex-encoded current value (use this in SET requests)
          example: "0x1007d"
        formatted:
          type: string
          description: Human-readable display value (also accepted by SET)
          example: "1/125"
        writable:
          type: boolean
          description: |
            Whether this property is writable **in the camera's current state**.
            Depends on the priority key: with `camera-position` held most of the
            body reports `false`. Claim `pc-remote` before treating this as a
            statement about the model. See `getProperty` for the full caveat.
        available_values:
          type: array
          items:
            $ref: "#/components/schemas/AvailableValue"
          description: |
            Values the camera accepts **right now**. Empty for properties with no
            enumerated values (ranges, freeform strings), and also when the
            priority key blocks writes. The set can shrink or grow as other
            properties change — `focus-area` loses its Tracking variants when
            `focus-mode` is not continuous — so re-read after related changes
            rather than caching.
          x-fern-property-name: availableValues

    AvailableValue:
      type: object
      description: |
        Single entry inside the `available_values` array returned by single-GET
        property responses. Contains only the hex value (as a string) and the
        formatted label — no separate numeric value field. The bulk endpoint
        uses `BulkAvailableValue`, which is a different shape.
      required: [value, formatted]
      properties:
        value:
          type: string
          description: Hex value to use in SET requests
          example: "0x11f40"
        formatted:
          type: string
          description: Human-readable label
          example: "1/8000"

    BulkPropertyEntry:
      type: object
      description: |
        Per-property entry inside the `data.properties` map returned by
        `GET /api/cameras/{id}/properties/all`. Note that this schema is NOT
        the same as `PropertyData`:

        - Field names are prefixed with `current_` (`current_value`,
          `current_hex_value`, `current_formatted`)
        - `writable` is a real JSON boolean, not a stringified one
        - Each entry in `available_values` includes BOTH a numeric `value`
          and a `hex_value` string

        This is because the bulk handler serializes property data inline rather
        than going through the string-string `data` map.
      required: [current_value, current_hex_value, current_formatted, writable, available_values]
      properties:
        current_value:
          type: number
          format: double
          description: |
            Numeric SDK value. Typed as `number` (rather than `int64`) because
            some properties (e.g. `exposure-compensation`, `image-id-num`) emit
            UInt64-range values on the wire that don't fit in a signed 64-bit
            integer. Treat this field as opaque — use `current_hex_value` in
            SET requests.
          example: 100
          x-fern-property-name: currentValue
        current_hex_value:
          type: string
          example: "0x1007d"
          x-fern-property-name: currentHexValue
        current_formatted:
          type: string
          example: "1/125"
          x-fern-property-name: currentFormatted
        writable:
          type: boolean
        available_values:
          type: array
          items:
            $ref: "#/components/schemas/BulkAvailableValue"
          x-fern-property-name: availableValues

    BulkAvailableValue:
      type: object
      required: [value, hex_value, formatted]
      properties:
        value:
          type: number
          format: double
          description: |
            Numeric SDK value. Typed as `number` (rather than `int64`) because
            some properties emit UInt64-range values on the wire that don't fit
            in a signed 64-bit integer. Treat this field as opaque — use
            `hex_value` in SET requests.
          example: 32000
        hex_value:
          type: string
          example: "0x11f40"
          x-fern-property-name: hexValue
        formatted:
          type: string
          example: "1/8000"

    BulkPropertiesData:
      type: object
      description: |
        Wrapper object inside the bulk-GET `data` field. The
        `properties` member is a map of property name → entry.
      required: [properties, total_properties]
      properties:
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BulkPropertyEntry"
          description: Map of property name (matches `PropertyName`) to its current value entry
        total_properties:
          type: integer
          description: |
            Total number of property entries the camera reported (BEFORE deduplication).
          x-fern-property-name: totalProperties

    PriorityKeyData:
      type: object
      properties:
        setting:
          $ref: "#/components/schemas/PriorityKeySetting"
        rawValue:
          type: string

    LiveViewStatus:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether live view is enabled on the camera body.
        streaming:
          type: boolean
          description: Whether the server is currently capturing frames.

    OSDStatus:
      type: object
      properties:
        supported:
          type: boolean
          description: Whether the connected camera body supports OSD composite frames.
        enabled:
          type: boolean
          description: Whether OSD mode is currently enabled.

    SaveInfoData:
      type: object
      properties:
        path:
          type: string
        prefix:
          type: string
        startNo:
          type: integer
          description: Starting file number.

    SDCardFile:
      type: object
      required: [content_id, file_id, file_path, file_size]
      properties:
        content_id:
          type: integer
          description: SDK content handle for use in download requests
          x-fern-property-name: contentId
        file_id:
          type: integer
          description: |
            SDK file handle. Always `0` in contents-transfer mode (one file per content).
            Multi-file content (e.g. RAW+JPEG pair) returns separate entries with the
            same `content_id` and distinct `file_id` values.
          x-fern-property-name: fileId
        file_path:
          type: string
          example: "DCIM/100MSDCF/DSC00001.ARW"
          x-fern-property-name: filePath
        file_size:
          type: integer
          format: int64
          description: File size in bytes
          x-fern-property-name: fileSize
        width:
          type: integer
          description: Image width in pixels (contents-transfer mode only)
        height:
          type: integer
          description: Image height in pixels (contents-transfer mode only)
        creation_year:
          type: integer
          x-fern-property-name: creationYear
        creation_month:
          type: integer
          x-fern-property-name: creationMonth
        creation_day:
          type: integer
          x-fern-property-name: creationDay
        creation_hour:
          type: integer
          x-fern-property-name: creationHour
        creation_minute:
          type: integer
          x-fern-property-name: creationMinute
        creation_second:
          type: integer
          x-fern-property-name: creationSecond

    SDCardFileListResponse:
      type: object
      required: [success, slot, file_count, files]
      properties:
        success:
          type: boolean
        slot:
          type: integer
        file_count:
          type: integer
          x-fern-property-name: fileCount
        files:
          type: array
          items:
            $ref: "#/components/schemas/SDCardFile"

    SDCardDownloadRequest:
      type: object
      description: Optional save path override. If omitted, uses the connection-time `SetSaveInfo` path.
      properties:
        save_path:
          type: string
          description: Directory path on host PC to save the file
          example: "/Users/me/Pictures/captures"
          x-fern-property-name: savePath

    AsyncOperationResponse:
      type: object
      description: |
        Generic envelope for async operations that have been accepted but not yet completed.
        Watch for the corresponding SSE event (`downloadComplete`, `transferProgress`) to
        learn when the operation finishes.
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    CompressedDownloadResponse:
      type: object
      description: Response envelope for thumbnail/screennail downloads.
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        type:
          type: string
          enum: [thumbnail, screennail]

    # --- Request schemas ---

    ConnectionRequest:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/ConnectionMode"
        auth:
          $ref: "#/components/schemas/ConnectionAuth"
        username:
          type: string
          deprecated: true
          description: |
            Deprecated — use `auth.username`. Still honoured, but it cannot carry
            a fingerprint, so on its own it is not enough for a body with access
            authentication switched on. `auth` wins when both are present.
        password:
          type: string
          deprecated: true
          description: Deprecated — use `auth.password`.
        reconnecting:
          type: string
          enum: ["on", "off"]
          description: Auto-reconnect on disconnection

    ConnectionAuth:
      type: object
      description: |
        Credentials for a camera with **access authentication** switched on.

        Omit this entirely for USB, and for networked bodies with access
        authentication off — that is the ordinary case and it connects
        unauthenticated exactly as before.

        A body that requires authentication needs all three fields together.
        Verified on an ILCE-1M2 over Ethernet: the camera checks its own
        fingerprint first and the credentials second, so the two failures are
        reported separately.

        Credentials are never echoed in a response and never written to the
        server log — only whether authentication was attempted.
      properties:
        username:
          type: string
          description: Access-authentication user, as shown on the camera.
        password:
          type: string
          format: password
          description: Access-authentication password, as shown on the camera.
        fingerprint:
          type: string
          description: |
            The camera's fingerprint. **Get this from `getFingerprint`, not by
            reading it off the camera screen** — the SDK's rendering is what the
            connect check compares against, and a transcribed value is easy to
            get subtly wrong. A single missing `=` of base64 padding is enough to
            fail with `0x8215`.

    PropertySetRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: |
            Hex value from `available_values` (e.g. `"0x1007d"`), human-readable
            string (e.g. `"1/125"`, `"f/5.6"`, `"wide"`), or decimal string.

    ButtonRequest:
      type: object
      required: [button]
      properties:
        button:
          type: string
          description: |
            Which button to press. Not every body accepts every name — a `400`
            response lists what the connected camera reports as operable.
          enum:
            - up
            - down
            - left
            - right
            - enter
            - menu
            - multi-selector-up
            - multi-selector-down
            - multi-selector-left
            - multi-selector-right
            - multi-selector-enter
            - multi-selector-right-up
            - multi-selector-right-down
            - multi-selector-left-up
            - multi-selector-left-down
            - fn
            - playback
            - delete
            - mode
            - c1
            - c2
            - c3
            - c4
            - c5
            - c6
            - c7
            - movie
            - ael
            - af-on
            - home
            - clips
            - slot-select
            - display
            - cancel-back
            - thumbnail
        action:
          type: string
          enum: [press, down, up]
          description: |
            `down` to hold and `up` to release. Omit (or send `press`) for a full
            down-then-up. An `up` is always accepted so a held key can be
            released.

    ShutterRequest:
      type: object
      properties:
        action:
          type: string
          enum: [down, up]
          description: |
            For continuous shooting: `down` to start, `up` to stop.
            Omit for single shot.

    ZoomRequest:
      description: |
        Power zoom command. The server accepts two forms:

        - **Direction + speed preset** (`ZoomDirectionalRequest`):
          `{ "direction": "in" | "out", "speed": "normal" | "fast" }`.
        - **Signed speed** (`ZoomSignedSpeedRequest`):
          `{ "speed": -10..+10 }`. Negative = zoom out, positive = zoom in,
          magnitude = speed. `0` stops the zoom.

        The two forms are disjoint on the `speed` field's JSON type, so
        generated SDKs may either expose them as an untagged union or
        surface one method per form (see `x-fern-sdk-method-name` on the
        endpoint).
      oneOf:
        - $ref: "#/components/schemas/ZoomDirectionalRequest"
        - $ref: "#/components/schemas/ZoomSignedSpeedRequest"

    ZoomDirectionalRequest:
      type: object
      description: Direction + named speed preset.
      required: [direction, speed]
      properties:
        direction:
          type: string
          enum: [in, out]
        speed:
          type: string
          enum: [normal, fast]

    ZoomSignedSpeedRequest:
      type: object
      description: |
        Signed speed in range `-10..+10`. Positive = zoom in, negative =
        zoom out, magnitude = speed. `0` stops an in-progress zoom.
      required: [speed]
      properties:
        speed:
          type: integer
          minimum: -10
          maximum: 10

    FocusNearFarRequest:
      type: object
      required: [step]
      properties:
        step:
          type: integer
          minimum: -7
          maximum: 7
          description: |
            Negative = near, positive = far. Magnitude controls speed. 0 is invalid.

    SaveInfoRequest:
      type: object
      properties:
        path:
          type: string
          description: Directory path on host PC
        prefix:
          type: string
          description: Filename prefix
        startNo:
          type: integer
          description: Starting file number

    AFAreaPositionRequest:
      type: object
      description: |
        Supply either `x` and `y`, or a `normalized` object. If both are present,
        `normalized` wins.
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 639
          description: Frame centre X in the camera's AF coordinate space.
        y:
          type: integer
          minimum: 0
          maximum: 479
          description: Frame centre Y in the camera's AF coordinate space.
        normalized:
          type: object
          description: |
            Frame centre as 0-1 fractions of the live view — use this for a tap or
            click position without converting to the SDK's coordinate space.
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            y:
              type: number
              minimum: 0
              maximum: 1

    AFFrame:
      type: object
      description: A single autofocus frame as the camera reports it.
      properties:
        type:
          type: string
          description: |
            Frame type, e.g. `contrast-flexible-main`, `contrast-flexible-assist`,
            `phase-detection-image-sensor`, `wide`, `zone`, `central-emphasis`,
            `contrast`, `frame-somewhere`, `unknown`.
        state:
          type: string
          description: |
            `focused`, `not-focused`, `moving`, `selection`, `registration-af`,
            `island` or `unknown`. Drive the box colour from this.
        priority:
          type: integer
        normalized:
          type: object
          description: Frame centre as 0-1 fractions — use this to place an overlay.
          properties:
            x: { type: number }
            y: { type: number }
        position:
          type: object
          description: |
            The same centre in the coordinate space `setAFAreaPosition` accepts, so
            a value read here can be written straight back.
          properties:
            x: { type: integer }
            y: { type: integer }
        size:
          type: object
          description: Box dimensions, raw and as a fraction of the frame.
          properties:
            width: { type: integer }
            height: { type: integer }
            normalized_width: { type: number }
            normalized_height: { type: number }
        raw:
          type: object
          description: The camera's own numerator/denominator pair, unconverted.
          properties:
            xNumerator: { type: integer }
            xDenominator: { type: integer }
            yNumerator: { type: integer }
            yDenominator: { type: integer }

    AFAreaPositionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            available:
              type: boolean
              description: Whether the camera reported a focus frame at all.
            frame_count:
              type: integer
            frames:
              type: array
              description: |
                One entry per frame. Expanding and tracking areas report a main
                box plus an assist box — render every entry.
              items:
                $ref: "#/components/schemas/AFFrame"

    TouchRequest:
      type: object
      description: |
        Supply either `x` and `y`, or a `normalized` object. If both are present,
        `normalized` wins. Same coordinate space as `AFAreaPositionRequest`.
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 639
          description: Touch point X in the camera's coordinate space.
        y:
          type: integer
          minimum: 0
          maximum: 479
          description: Touch point Y in the camera's coordinate space.
        normalized:
          type: object
          description: |
            Touch point as 0-1 fractions of the live view — use this for a tap or
            click position without converting to the SDK's coordinate space.
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            y:
              type: number
              minimum: 0
              maximum: 1

    TrackingFrame:
      type: object
      description: A single tracking frame as the camera reports it.
      properties:
        type:
          type: string
          description: |
            `target-af` for the subject being tracked, `non-target-af` for a
            candidate the camera is showing but not acting on, or `unknown`.
        state:
          type: string
          description: |
            `focused`, `not-focused`, `moving`, `selection`, `registration-af`,
            `island` or `unknown` — the same states the AF frame reports.
        priority:
          type: integer
        normalized:
          type: object
          description: Frame centre as 0-1 fractions — use this to place an overlay.
          properties:
            x: { type: number }
            y: { type: number }
        position:
          type: object
          description: |
            The same centre in the coordinate space `remoteTouch` accepts, so a
            tracked position can be fed straight back in.
          properties:
            x: { type: integer }
            y: { type: integer }
        size:
          type: object
          description: Box dimensions, raw and as a fraction of the frame.
          properties:
            width: { type: integer }
            height: { type: integer }
            normalized_width: { type: number }
            normalized_height: { type: number }
        raw:
          type: object
          description: The camera's own numerator/denominator pair, unconverted.
          properties:
            xNumerator: { type: integer }
            xDenominator: { type: integer }
            yNumerator: { type: integer }
            yDenominator: { type: integer }

    FingerprintResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            ssh_supported:
              type: boolean
              description: |
                Whether this body uses access authentication. When `false`, no
                fingerprint is returned and none is needed to connect.
            fingerprint:
              type: string
              description: |
                Pass verbatim as `auth.fingerprint`, including any trailing `=`.
                Absent when `ssh_supported` is `false`.
            length:
              type: integer
              description: |
                Character count, so a caller can spot a truncated copy-paste.

    TrackingFrameResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            available:
              type: boolean
              description: |
                Whether the tracking property could be read. True with an empty
                `frames` array means nothing is being tracked.
            frame_count:
              type: integer
            frames:
              type: array
              description: One entry per frame the camera reports.
              items:
                $ref: "#/components/schemas/TrackingFrame"

    SettingsFileRequest:
      type: object
      properties:
        filename:
          type: string
          description: Settings filename (e.g. `CUMSET.DAT`)

    SettingsFileListResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        files:
          type: array
          items:
            type: string
        count:
          type: integer

    LUTImportRequest:
      type: object
      required: [filePath]
      properties:
        filePath:
          type: string
          description: Absolute or working-directory-relative path to a `.cube` file on the host
          example: "/Users/me/luts/example.cube"
        slot:
          type: integer
          minimum: 1
          maximum: 16
          default: 1
          description: Camera user LUT slot to import into

    LUTImportResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            slot:
              type: integer
            file:
              type: string

    # --- Server schemas ---

    ServerStatus:
      type: object
      required: [success, server, cameras]
      properties:
        success:
          type: boolean
        server:
          type: object
          required: [version, sdkVersion, uptime, platform]
          properties:
            version:
              type: string
              description: |
                Server binary version (hardcoded in `handleApiServerStatus`).
                Distinct from the OpenAPI spec version in `info.version`.
              example: "3.0.0"
            sdkVersion:
              type: string
              description: |
                Version of the Sony Camera Remote SDK this binary is linked
                against, read at runtime via `GetSDKVersion()`. It reflects the
                library actually loaded, so it tracks an SDK upgrade without a
                code change.
              example: "V2.02.00"
            uptime:
              type: integer
              description: Server uptime in seconds
            platform:
              type: string
              description: Host OS platform identifier
              enum: [darwin-arm64, darwin-x64, linux-arm64, linux-arm, linux-x64, win32-x64, unknown]
              example: "darwin-arm64"
        cameras:
          type: object
          required: [connected, discovered]
          properties:
            connected:
              type: integer
              description: Number of currently connected cameras
            discovered:
              type: integer
              description: Number of discovered (available) cameras

    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        cameraId:
          type: string
          description: Camera ID if log is camera-specific

    # --- Enums ---

    ConnectionMode:
      type: string
      enum: [remote, remote-transfer, contents]
      description: |
        - `remote` — Full control + auto-transfer of captured images to host PC
        - `remote-transfer` — Full control + explicit SD card file access
        - `contents` — SD card file access only (no shooting or settings control)

    PropertyName:
      type: string
      description: |
        Canonical REST property names. Mirrors the server's `PROPERTY_MAP`
        (`webapp/server/src/CameraWebController.cpp`). Use `GET /properties/all`
        to see the full set with current values, writability, and accepted ranges
        for the connected camera.

        Some properties are read-only on every body (status / state fields).
        Others are read-only depending on shooting mode (e.g. `aperture` is
        read-only outside Manual / Aperture-priority modes). Always check the
        `writable` field on a single GET before attempting a SET.

        ## Property tiers

        **Core (R/W):** `iso`, `aperture`, `shutter-speed`, `drive-mode`,
        `white-balance`, `focus-mode`, `exposure-program-mode`,
        `still-image-store-destination`

        **Image format:** `file-format`, `image-quality`, `raw-compression`

        **Focus:** `focus-area`, `focus-distance` (read), `focus-position`,
        `focus-position-current` (read), `focus-driving-status` (read)

        **Zoom:** `zoom-distance` (read), `zoom-setting`

        **Battery / power:** `battery-remain` (read)

        **Video state / format:** `recording-state` (read), `movie-file-format`,
        `movie-recording-setting`, `movie-recording-frame-rate`

        **Thermal / errors:** `overheating-state` (read),
        `camera-error-caution-status` (read), `system-error-caution-status` (read),
        `camera-system-error-info` (read)

        **Camera-settings file gates (read):** `camera-setting-save-enable`,
        `camera-setting-read-enable`, `camera-setting-save-read-state` — whether
        the camera will accept `downloadCameraSettings` / `uploadCameraSettings`.
        Both enable flags are `0` Disable / `1` Enable; the state is `0` Idle /
        `1` Reading. Check these when either endpoint returns 400.

        **Media slots:** `media-slot1-status`, `media-slot1-remaining-photos`,
        `media-slot1-remaining-time`, `media-slot2-status`,
        `media-slot2-remaining-photos`, `media-slot2-remaining-time` (all read)

        **Exposure:** `exposure-compensation`, `metering-mode`, `ae-lock`,
        `exposure-step`

        **Flash:** `flash-mode`, `flash-compensation`, `wireless-flash`

        **Shutter / silent:** `shutter-type`, `shutter-mode`, `silent-mode`,
        `shutter-angle`

        **Image:** `image-size`, `aspect-ratio`, `color-space`, `dro`, `high-iso-nr`

        **WB fine-tune:** `awb-lock`, `white-balance-color-temp`

        **Creative / picture profile:** `creative-look`, `flicker-less-shooting`,
        `picture-profile`, `pp-lut-base-look`

        **Audio:** `audio-recording`, `audio-input-master-level`

        **Timecode:** `timecode-preset`, `timecode-format`, `timecode-run`,
        `timecode-make`

        **Stabilization / NR:** `image-stabilization`, `movie-stabilization`,
        `long-exposure-nr`

        **CineEI / LUT:** `movie-shooting-mode`, `movie-shooting-mode-color-gamut`,
        `base-look-import-enable`, `embed-lut-file`, `base-look-value`,
        `shooting-enable`, `exposure-index`, `base-iso`, `aps-c-s35`

        **Image ID (MakerNote):** `image-id-string`, `image-id-string-max-length`,
        `image-id-num`, `image-id-num-setting`

        **Priority:** `priority-key` (also exposed as `/priority-key` resource)
      enum:
        # Core
        - priority-key
        - iso
        - aperture
        - shutter-speed
        - drive-mode
        - white-balance
        - focus-mode
        - exposure-program-mode
        - still-image-store-destination
        # Image format
        - file-format
        - image-quality
        - raw-compression
        # Focus
        - focus-area
        - focus-distance
        - focus-position
        - focus-position-current
        - focus-driving-status
        # Zoom
        - zoom-distance
        - zoom-setting
        # Battery
        - battery-remain
        # Video state / format
        - recording-state
        - movie-file-format
        - movie-recording-setting
        - movie-recording-frame-rate
        # Thermal / errors
        - overheating-state
        - camera-error-caution-status
        - system-error-caution-status
        - camera-system-error-info
        # Camera-settings file save/load gates
        - camera-setting-save-enable
        - camera-setting-read-enable
        - camera-setting-save-read-state
        # Media slots
        - media-slot1-status
        - media-slot1-remaining-photos
        - media-slot1-remaining-time
        - media-slot2-status
        - media-slot2-remaining-photos
        - media-slot2-remaining-time
        # Exposure
        - exposure-compensation
        - metering-mode
        - ae-lock
        - exposure-step
        # Flash
        - flash-mode
        - flash-compensation
        - wireless-flash
        # Shutter / silent
        - shutter-type
        - shutter-mode
        - silent-mode
        - shutter-angle
        # Image
        - image-size
        - aspect-ratio
        - color-space
        - dro
        - high-iso-nr
        # White balance fine-tune
        - awb-lock
        - white-balance-color-temp
        # Creative / picture profile
        - creative-look
        - flicker-less-shooting
        - picture-profile
        - pp-lut-base-look
        # Audio
        - audio-recording
        - audio-input-master-level
        # Timecode
        - timecode-preset
        - timecode-format
        - timecode-run
        - timecode-make
        # Stabilization / NR
        - image-stabilization
        - movie-stabilization
        - long-exposure-nr
        # CineEI / LUT
        - movie-shooting-mode
        - movie-shooting-mode-color-gamut
        - base-look-import-enable
        - embed-lut-file
        - base-look-value
        - shooting-enable
        - exposure-index
        - base-iso
        - aps-c-s35
        # Image ID (MakerNote)
        - image-id-string
        - image-id-string-max-length
        - image-id-num
        - image-id-num-setting

    PriorityKeySetting:
      type: string
      enum: [pc-remote, camera-position]
      description: |
        - `pc-remote` — Server has control (required for remote operation)
        - `camera-position` — Camera body has control
