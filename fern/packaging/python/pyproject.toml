[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-sdk-client"
version = "0.0.0"
description = "Python client for the Alpha Camera REST API — control Sony cameras via REST."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Alpha Camera" }]
keywords = [
    "sony",
    "alpha",
    "camera",
    "rest",
    "api",
    "sdk",
    "client",
    "photography",
    "tethering",
    "remote-control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=1.9.2",
    "typing_extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/crsdk/alpha-sdk-python"
Repository = "https://github.com/crsdk/alpha-sdk-python"
Issues = "https://github.com/crsdk/alpha-sdk-python/issues"
Changelog = "https://github.com/crsdk/alpha-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_sdk_client"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
