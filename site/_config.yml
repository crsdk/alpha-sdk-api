# Jekyll configuration for the Alpha Camera REST API docs.
#
# Built by .github/workflows/pages.yml with `bundle exec jekyll build`, using
# the just-the-docs gem pinned in the Gemfile. The gem is used rather than
# `remote_theme:` so the build does not fetch a theme over the network at deploy
# time — the same reasoning that made us vendor the Scalar bundle.

title: Alpha Camera REST API
description: >-
  An HTTP server that runs on your machine and controls a connected Sony Alpha
  camera. Reference, guides and a live request console.

theme: just-the-docs

# Dark, neutral, matched to the Scalar reference — see
# _sass/color_schemes/scalar.scss for where the values come from.
color_scheme: scalar

# Project Pages serve from https://<owner>.github.io/alpha-sdk-api, so every
# internal link needs this prefix. Content links are written as
# {{ site.baseurl }}/... for exactly this reason — see the porting notes in
# MIGRATION-HANDOFF.md. Deliberately no `url:`/custom domain: crsdk.app was
# retired, and hardcoding an owner here would break on repo transfer.
baseurl: /alpha-sdk-api

# Extensionless URLs, matching the routes Mintlify served (/web-api/overview,
# not /web-api/overview.html). Every internal link in the ported content is
# written that way, and llms.txt publishes the same shapes, so this keeps the
# old URLs working instead of breaking all 135 of them.
permalink: pretty

# The API reference is a standalone Scalar page, not a Jekyll page. It has no
# front matter, so Jekyll copies it through untouched.
# baseurl is prepended by the theme, so this must NOT repeat it.
nav_external_links:
  - title: API reference & request console
    url: /api-reference/
    hide_icon: false

# just-the-docs ships client-side search generated at build time. This is what
# replaces Mintlify's built-in search, which had no config to port.
search_enabled: true
search:
  heading_level: 2
  previews: 3
  tokenizer_separator: /[\s/]+/

heading_anchors: true

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  info:
    title: Info
    color: purple
  warning:
    title: Warning
    color: red
  check:
    title: Check
    color: green

aux_links:
  Source on GitHub:
    - https://github.com/jordlee/alpha-sdk-api
aux_links_new_tab: true

back_to_top: true
back_to_top_text: Back to top

# Keep the Scalar bundle and the spec out of Jekyll's page pipeline. They are
# static assets; Jekyll copies them, but must not try to render them.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  # Maintainer notes for the vendored bundle, not a page for readers. It also
  # quotes a CDN <script> tag as an example of what not to do, which has no
  # business being served.
  - assets/scalar/VENDORED.md

kramdown:
  input: GFM
  syntax_highlighter: rouge
